channel: cheers-24-7
number: 101
name: "Cheers 24/7"
channel_type: network
timezone: America/New_York

format:
  video: { width: 968, height: 720, frame_rate: "30000/1001" }
  audio: { sample_rate: 48000, channels: 2 }
  grid_minutes: 30

# -----------------------------
# CONTENT POOLS (select.where — normalized to match at compile time)
# -----------------------------

pools:

  cheers:
    select:
      where:
        type:
          eq: episode
        series_title:
          eq: Cheers

  commercials:
    select:
      where:
        type:
          eq: commercial
        tags:
          excludes_any: [anime]

  promos:
    select:
      where:
        type:
          eq: promo

  bumpers:
    select:
      where:
        type:
          eq: bumper

# -----------------------------
# PROGRAM DEFINITIONS
# -----------------------------

programs:

  cheers:
    pool: cheers
    grid_blocks_max: 1
    fill_mode: single
    presentation: sitcom

presentation:

  programs:

    sitcom:
      midroll:
        - type: traffic
          profile: sitcom
          fill: remaining
          placement:
            fallback:
              strategy: weighted_positions
              positions: [0.30, 0.72]
              weights:   [1,    1]

# -----------------------------
# TRAFFIC CONFIG
# -----------------------------

traffic:

  profiles:
    sitcom:
      allowed_pools: [commercials]
      weights:
        commercials: 1
      rotation:
        strategy: weighted
      duration_strategy: pack
      default_cooldown_seconds: 3600
      max_plays_per_day: 0

  default_profile: sitcom

# -----------------------------
# SCHEDULE
# -----------------------------

schedule:

  all_day:
    - start: "06:00"
      slots: 48
      program: [cheers]
      progression: sequential
