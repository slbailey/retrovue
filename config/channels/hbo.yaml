channel: hbo
number: 201
name: "Home Box Office"
channel_type: premium
timezone: America/New_York

format:
  video: { width: 1280, height: 720, frame_rate: "30000/1001" }
  audio: { sample_rate: 48000, channels: 2 }
  grid_minutes: 30

# -----------------------------
# CONTENT POOLS
# -----------------------------

pools:

  traffic_trailers:
    select:
      where:
        type:
          eq: trailer
        tags:
          excludes_any: [anime]

  traffic_teasers:
    select:
      where:
        type:
          eq: teaser
        tags:
          excludes_any: [anime]

  intros:
    select:
      where:
        type:
          eq: bumper
        tags:
          contains_all: [hbo, presentation, intros]

  ratings_cards:
    select:
      where:
        type:
          eq: bumper
        tags:
          contains_all: [hbo, presentation, ratings_cards]

  # NEW (T2/T3 support)
  station_ids:
    select:
      where:
        type:
          eq: station_id
        tags:
          contains_all: [hbo, station_ids]

  coming_up_next_promos:
    select:
      where:
        type:
          eq: promo
        tags:
          contains_all: [hbo, coming_up_next]

  late_night_intros:
    select:
      where:
        type:
          eq: bumper
        tags:
          contains_all: [hbo, presentation, late_night_intros]

  movies:
    select:
      where:
        type:
          eq: movie


# -----------------------------
# PROGRAM DEFINITIONS (T0 + T1)
# -----------------------------

programs:

  hbo_movies_g:
    pool: movies
    select:
      where:
        rating:
          eq: "G"
    grid_blocks_max: 5
    fill_mode: single
    presentation: movies

  hbo_movies_pg:
    pool: movies
    select:
      where:
        rating:
          eq: "PG"
    grid_blocks_max: 5
    fill_mode: single
    presentation: movies

  hbo_movies_pg13:
    pool: movies
    select:
      where:
        rating:
          eq: "PG-13"
    grid_blocks_max: 5
    fill_mode: single
    presentation: movies

  hbo_movies_r:
    pool: movies
    select:
      where:
        rating:
          eq: "R"
    grid_blocks_max: 5
    fill_mode: single
    presentation: movies

  hbo_scifi_movies:
    pool: movies
    select:
      where:
        genres:
          in: ["Science Fiction", "Fantasy"]
        rating:
          in: ["PG", "PG-13", "R"]
    grid_blocks_max: 5
    fill_mode: single
    presentation: movies

# -----------------------------
# CHANNEL-LEVEL PRESENTATION (T2 + T3)  ← NEW
# -----------------------------

presentation:

  # -------------------------
  # PROGRAM-LEVEL (by type)
  # -------------------------
  programs:

    movies:

      preroll:
        - pool: intros
        - pool: ratings_cards
          select:
            where:
              tags:
                eq: program.rating_tag

      postroll:
        - pool: coming_up_next_promos
        - type: traffic
          profile: hbo_premium
          fill: remaining
        - pool: station_ids


  # -------------------------
  # DAYPART-LEVEL (by id)
  # -------------------------
  dayparts:

    late_night:

      preroll:
        - pool: late_night_intros
          

# -----------------------------
# TRAFFIC CONFIG (T4)
# -----------------------------

traffic:

  profiles:
    hbo_premium:
      allowed_pools: [traffic_trailers, traffic_teasers]
      weights:
        traffic_trailers: 3
        traffic_teasers: 1
      rotation:
        strategy: weighted
      duration_strategy: pack
      default_cooldown_seconds: 3600
      max_plays_per_day: 0

  default: hbo_premium


# -----------------------------
# SCHEDULE
# -----------------------------

schedule:

  all_day:
    - start: "06:00"
      slots: 8
      program: [hbo_movies_g]
      progression: random
      bleed: true

    - start: "10:00"
      slots: 20
      program: [hbo_movies_pg, hbo_movies_pg13]
      progression: random
      bleed: true

    - start: "20:00"
      daypart: late_night   # ← THIS defines the daypart
      slots: 20
      program: [hbo_movies_pg, hbo_movies_pg13, hbo_movies_r]
      progression: random
      bleed: true

  sunday:
    - start: "14:00"
      slots: 5
      program: hbo_scifi_movies
      progression: random
      bleed: true