# Planning must not bypass ChannelManager to reach AIR

- type: forbids
  from: { kind: service, id: playlist-schedule-manager }
  to: { kind: service, id: air-playout-engine }
  note: INV-SCHEDULEMANAGER-NO-AIR-ACCESS-001

# Scheduling → playout execution bridge (truth spine: execution plan → playlog)

- type: depends_on
  from: { kind: entity, id: playlog }
  to: { kind: entity, id: execution-entry }
  note: Playlog/events materialize from the locked execution plan horizon; not from playlist as authority

# Ingest → scheduling eligibility (read-only conceptual)
# NOTE: Program entity is retired (RETA-88). Eligibility now flows through
# DSL schedule blocks referencing asset pools, not through the Program CRUD entity.
# The conceptual dependency (scheduling → eligible assets) remains valid.

- type: depends_on
  from: { kind: service, id: dsl-schedule-service }
  to: { kind: entity, id: asset }
  note: DSL schedule blocks resolve to eligible catalog material via asset pools; not a runtime library call from ChannelManager

# Ambiguity anchors (disambiguation nodes)

- type: depends_on
  from: { kind: ambiguity, id: dual-meaning-producer }
  to: { kind: service, id: block-plan-producer }

- type: depends_on
  from: { kind: ambiguity, id: dual-meaning-producer }
  to: { kind: service, id: air-playout-engine }

- type: depends_on
  from: { kind: ambiguity, id: schedule-manager-vs-playlist-schedule-manager }
  to: { kind: service, id: playlist-schedule-manager }

- type: depends_on
  from: { kind: ambiguity, id: collection-vs-container }
  to: { kind: entity, id: container }

- type: depends_on
  from: { kind: ambiguity, id: collection-vs-container }
  to: { kind: entity, id: zone }
  note: Zone entity is retired (RETA-88); ambiguity preserved for historical disambiguation

- type: depends_on
  from: { kind: ambiguity, id: program-director-import-alias }
  to: { kind: service, id: program-director }

# Evidence server cross-domain: playout service depends on systems clock authority

- type: depends_on
  from: { kind: service, id: evidence-server }
  to: { kind: service, id: master-clock }
  note: Clock authority for ACK timestamps and evidence processing (RETA-11 injection)
