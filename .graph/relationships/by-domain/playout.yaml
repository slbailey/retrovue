- type: drives
  from: { kind: service, id: program-director }
  to: { kind: service, id: channel-manager }
  note: Activation and supervision; single entry path per INV-SINGLE-ACTIVATION-PATH-001

- type: consumes
  from: { kind: service, id: channel-manager }
  to: { kind: entity, id: playlog }
  note: Primary execution input; broadcast-accurate automation/event stream from scheduling horizon

- type: depends_on
  from: { kind: service, id: block-plan-producer }
  to: { kind: entity, id: playlog }
  note: Feeds BlockPlan from resolved execution timing in the playlog spine, not from playlist as root

- type: consumes
  from: { kind: service, id: hls-segmenter }
  to: { kind: entity, id: segment-ring }

- type: depends_on
  from: { kind: service, id: hls-consumption-adapter }
  to: { kind: service, id: program-director }

- type: depends_on
  from: { kind: service, id: ts-consumption-adapter }
  to: { kind: service, id: program-director }

- type: owns
  from: { kind: service, id: block-plan-producer }
  to: { kind: entity, id: block-plan }
  note: Core authority over BlockPlan message stream fed to AIR; AIR executes only

- type: depends_on
  from: { kind: service, id: playout-session }
  to: { kind: service, id: channel-manager }

- type: drives
  from: { kind: service, id: channel-manager }
  to: { kind: service, id: air-playout-engine }

- type: consumes
  from: { kind: service, id: air-playout-engine }
  to: { kind: entity, id: block-plan }
  note: BlockPlan mode; consumes fed blocks via gRPC contract

- type: constrained_by
  from: { kind: service, id: channel-manager }
  to: { kind: invariant, id: INV-CHANNELMANAGER-NO-PLANNING-001 }

- type: constrained_by
  from: { kind: service, id: channel-manager }
  to: { kind: invariant, id: INV-EPG-NONAUTHORITATIVE-FOR-PLAYOUT-001 }

- type: constrained_by
  from: { kind: service, id: hls-consumption-adapter }
  to: { kind: invariant, id: INV-SINGLE-ACTIVATION-PATH-001 }

- type: constrained_by
  from: { kind: service, id: ts-consumption-adapter }
  to: { kind: invariant, id: INV-SINGLE-ACTIVATION-PATH-001 }

- type: constrained_by
  from: { kind: service, id: hls-segmenter }
  to: { kind: invariant, id: INV-HLS-NO-DISK-IO-001 }

- type: constrained_by
  from: { kind: entity, id: segment-ring }
  to: { kind: invariant, id: INV-HLS-NO-DISK-IO-001 }
  note: In-memory segment store obligation applies to the ring and handlers

- type: constrained_by
  from: { kind: service, id: program-director }
  to: { kind: invariant, id: INV-LIFECYCLE-OBSERVABILITY-001 }
  note: Lifecycle transitions (activation, teardown, linger) must emit structured DEBUG events with session_id

- type: constrained_by
  from: { kind: service, id: channel-manager }
  to: { kind: invariant, id: INV-LIFECYCLE-OBSERVABILITY-001 }
  note: Viewer join/leave and segment events must carry correlation ID

- type: constrained_by
  from: { kind: service, id: hls-consumption-adapter }
  to: { kind: invariant, id: INV-LIFECYCLE-OBSERVABILITY-001 }
  note: Phantom session tracking must emit structured events with session_id

# gRPC hardening invariants (RETA-29 / RETA-48 / RETA-49 / RETA-51)

- type: constrained_by
  from: { kind: service, id: playout-session }
  to: { kind: invariant, id: INV-GRPC-DEADLINE-POLICY-001 }
  note: Every PlayoutControl RPC must carry a gRPC deadline

- type: constrained_by
  from: { kind: service, id: playout-session }
  to: { kind: invariant, id: INV-GRPC-FEED-BACKPRESSURE-001 }
  note: Feed must respect QUEUE_FULL and wait for boundary events

- type: constrained_by
  from: { kind: service, id: playout-session }
  to: { kind: invariant, id: INV-GRPC-GRACEFUL-DRAIN-001 }
  note: Stop must drain current block and wait for SessionEnded

- type: constrained_by
  from: { kind: service, id: playout-session }
  to: { kind: invariant, id: INV-GRPC-HEALTH-CHECK-001 }
  note: Readiness probing uses grpc.health.v1.Health, not GetVersion

- type: constrained_by
  from: { kind: service, id: air-playout-engine }
  to: { kind: invariant, id: INV-GRPC-HEALTH-CHECK-001 }
  note: AIR must implement grpc.health.v1.Health with service-level granularity

# Evidence server (gRPC evidence transport)

- type: consumes
  from: { kind: service, id: evidence-server }
  to: { kind: service, id: air-playout-engine }
  note: Receives execution evidence via bidirectional gRPC stream
